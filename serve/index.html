<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeakJar tiles</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>html, body, #map { margin: 0; height: 100%; }</style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Opens on the Tatras; the URL hash keeps the position across reloads
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style/outdoor.json',
      center: [20.0881, 49.1794],
      zoom: 12,
      hash: true,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
    map.addControl(new maplibregl.TerrainControl({ source: 'terrain', exaggeration: 1.2 }));
    map.addControl(new maplibregl.ScaleControl());
  </script>
</body>
</html>
